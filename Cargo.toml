[package]
name = "tygr-json-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "tygr-json-benchmark"

[dependencies]
nom = "8"
pest = "2"
pest_grammars = "2"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
tree-sitter = "0.27"
tree-sitter-json = "0.24"
tygr = { path = "../tygr", default-features = false }
winnow = "1"

[profile.release]
codegen-units = 1
lto = true

[lints.clippy]
# Grammars are nested generic types by design.
type_complexity = "allow"
